name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint-test-train-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint with flake8
        run: flake8 src api tests

      - name: Run unit tests
        run: |
          mkdir -p reports
          pytest -v --junitxml=reports/junit.xml

      - name: Train model
        run: python -m src.train

      - name: Build Docker image
        run: docker build -t heart-disease-api:ci .

      - name: Smoke-test the container
        run: |
          docker run -d --name heart-api -p 8000:8000 heart-disease-api:ci
          for i in $(seq 1 20); do
            curl -sf http://localhost:8000/health && break || sleep 2
          done
          curl -sf -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d @api/sample_request.json
          echo
          docker logs heart-api
          docker rm -f heart-api

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: reports/

      - name: Upload trained model and MLflow runs
        uses: actions/upload-artifact@v4
        with:
          name: model-and-tracking
          path: |
            models/
            mlflow.db
            mlruns/
